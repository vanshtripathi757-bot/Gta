<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111e">
<meta name="description" content="SUNSTATE: COASTLINE — a mobile-first tropical 3D open-world driving prototype.">
<title>SUNSTATE: COASTLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--cyan:#67e8f9;--glass:rgba(5,16,29,.76);--line:rgba(148,220,255,.24)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}
#canvas-container{position:fixed;inset:0;z-index:0}canvas{display:block}
.overlay{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:max(9px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));pointer-events:none}
.hud{background:var(--glass);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid var(--line);box-shadow:0 12px 34px #0005;border-radius:17px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:8px;pointer-events:auto;min-width:0}
.radar{width:48px;height:48px;border-radius:12px;background:#07111e;border:1px solid #67e8f955;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
#radar-canvas{width:100%;height:100%}
.display{font-family:Outfit,Inter,sans-serif}
.brand h1{font:900 clamp(10px,2.5vw,16px)/1.1 Outfit,Inter,sans-serif;letter-spacing:.035em;margin:0;white-space:nowrap}
#location-label{font-size:10px;color:#a5f3fc;margin-top:5px}
.badges{display:flex;gap:5px;margin-top:5px;font-size:9px;font-family:monospace}
.badges span{background:#15283a;border-radius:5px;padding:3px 5px;color:#a5f3fc}
.controls{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:5px;padding:6px;max-width:58%;pointer-events:auto}
button{font:800 10px Inter,sans-serif;color:#eafaff;border:1px solid #ffffff25;background:#132338e8;border-radius:10px;padding:8px 9px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:active{transform:scale(.95)}button.active{background:linear-gradient(120deg,#0891b2,#7c3aed);border-color:#a5f3fc}
#prompt-banner{align-self:center;margin:auto 0;opacity:0;transition:opacity .18s;background:#07111edb;border:1px solid #fbbf2480;color:#fde68a;padding:10px 16px;border-radius:999px;font-size:12px;font-weight:800;text-align:center}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.left-control{display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto}
#joystick-zone{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;position:relative;touch-action:none;border:2px solid #67e8f966}
.joy-ring{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff35}
#joystick-knob{position:absolute;left:50%;top:50%;width:43px;height:43px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#22d3ee,#8b5cf6);border:2px solid #fff;box-shadow:0 4px 18px #06b6d455;pointer-events:none}
.hint{font-size:9px;font-weight:800;color:#dbeafe;letter-spacing:.04em}
.telemetry{display:flex;align-items:center;gap:10px;padding:10px 12px;pointer-events:auto}
#speed-value{font:900 26px/.95 Outfit,sans-serif;color:var(--cyan);text-align:center}
.unit{font-size:9px;letter-spacing:.16em;color:#94a3b8;text-align:center;margin-top:4px}
.sep{height:36px;width:1px;background:#ffffff25}
.telemetry small{display:block;color:#94a3b8;font-size:9px}
.telemetry strong{font-size:10px;color:#fde68a;font-family:monospace}
.actions{display:grid;grid-template-columns:repeat(2,minmax(52px,1fr));gap:5px;pointer-events:auto}
.actions button{min-width:57px;padding:9px 7px}
.actions span{display:block;color:#94a3b8;font-size:9px;margin-top:3px}
#btn-enter-car{color:#fcd34d}#btn-sprint{color:#a5f3fc}#btn-jump{color:#f9a8d4}#btn-horn{color:#86efac}
.fatal{margin:24px;padding:18px;background:#0b1727;border:1px solid #ef4444;color:white;border-radius:16px}
@media(max-width:650px){
 .overlay{padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}
 .top{gap:5px}.brand{gap:7px;padding:6px}.radar{width:40px;height:40px}
 .controls{max-width:60%;gap:4px;padding:5px}.controls button{font-size:9px;padding:7px 6px}
 .bottom{gap:5px}.telemetry{padding:8px;gap:7px}.telemetry .extra{display:none}
 #joystick-zone{width:92px;height:92px}.actions{gap:4px}.actions button{min-width:52px;padding:8px 5px;font-size:9px}
}
@media(max-width:390px){.radar{display:none}.brand h1{font-size:10px}.controls{max-width:64%}.controls button{padding:6px 5px}.telemetry{gap:5px;padding:7px}.actions button{min-width:47px}.hint{font-size:8px}}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="overlay">
  <div class="top">
    <div class="hud brand">
      <div class="radar"><canvas id="radar-canvas" width="128" height="128"></canvas></div>
      <div>
        <h1>SUNSTATE: COASTLINE</h1>
        <div id="location-label">Ocean Drive Promenade</div>
        <div class="badges"><span id="fps-badge">FPS --</span><span id="mode-badge">ON FOOT</span></div>
      </div>
    </div>
    <div class="hud controls">
      <button id="btn-day" class="active">☀ DAY</button><button id="btn-sunset">SUNSET</button><button id="btn-night">NIGHT</button>
      <button id="btn-rain">RAIN OFF</button><button id="btn-audio">SOUND OFF</button><button id="btn-quality">QUALITY: HIGH</button>
    </div>
  </div>
  <div id="prompt-banner">Move closer to a car to drive</div>
  <div class="bottom">
    <div class="left-control">
      <div id="joystick-zone" class="hud"><div class="joy-ring"></div><div id="joystick-knob"></div></div>
      <div class="hint">DRAG / WASD</div>
    </div>
    <div class="hud telemetry">
      <div><div id="speed-value">00</div><div class="unit">MPH</div></div>
      <div class="sep"></div>
      <div><small>COASTAL DRIVE</small><strong id="status-text">EXPLORE FREELY</strong><small class="extra">Drag the world to look</small></div>
    </div>
    <div class="actions">
      <button id="btn-enter-car">CAR<span>[F]</span></button>
      <button id="btn-sprint">BOOST<span>[SHIFT]</span></button>
      <button id="btn-jump">JUMP<span>[SPACE]</span></button>
      <button id="btn-horn">HORN<span>[H]</span></button>
    </div>
  </div>
</div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
